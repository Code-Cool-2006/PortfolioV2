name: CI/CD Deploy to EC2

on:
  push:
    branches:
      - main # Triggers the workflow automatically whenever you push to the main branch
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/portfoliov2:latest 

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Run Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Log into Docker Hub on your EC2 instance
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            
            # Stop and remove the older running container version if it exists
            docker stop my-app-container || true
            docker rm my-app-container || true
            
            # Pull the fresh image from Docker Hub
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/portfoliov2:latest
            
            # Run the updated container (Mapped host port 80 to container port 3000)
            docker run -d --name my-app-container -p 80:3000 --restart always ${{ secrets.DOCKER_HUB_USERNAME }}/portfoliov2:latest
            
            # Clean up old, unused dangling images on your EC2 to free up disk space
            docker image prune -f